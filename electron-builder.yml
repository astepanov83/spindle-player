appId: io.github.astepanov83.spindle
productName: Spindle
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!prototype/*'
  - '!docs/*'
  - '!work/*'
  - '!.superpowers/**'
  - '!scripts/*'
  - '!vitest.config.ts'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,CLAUDE.local.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# ffmpeg and ffprobe run as programs, so they must be real files, not in app.asar
asarUnpack:
  - resources/**
linux:
  target:
    - AppImage
    - deb
  executableName: spindle
  syncDesktopName: true
  maintainer: Alexander Stepanov <alexander.stepanov.v@gmail.com>
  category: AudioVideo
  synopsis: A desktop music player for local files
  # In "Open with" for the songs it plays (ticket 124). %F: the files picked,
  # as paths. Being listed doesn't make it the default player.
  executableArgs: ['%F']
  mimeTypes:
    - audio/mpeg
    - audio/flac
    - audio/x-flac
    - audio/ogg
    - audio/x-vorbis+ogg
    - audio/x-opus+ogg
    - audio/opus
    - audio/mp4
    - audio/x-m4a
    - audio/aac
    - audio/x-aac
    - audio/wav
    - audio/x-wav
    - audio/vnd.wave
    - audio/x-ape
    - audio/x-wavpack
    - audio/x-ms-wma
    - audio/aiff
    - audio/x-aiff
    - application/x-cue
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
win:
  target:
    - nsis
    - zip
  # the zip's name; the installer sets its own below
  artifactName: ${name}-${version}-win-${arch}.${ext}
nsis:
  artifactName: ${name}-setup-${version}.${ext}
  # build/installer.nsh puts Spindle in "Open with" for its song types
  # (ticket 124); `fileAssociations` would make it their default program
  include: build/installer.nsh
npmRebuild: false
