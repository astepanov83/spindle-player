<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spindle</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <!-- 280px square, as SIZE in src/main/splash.ts. The record is 52% of it
         and the ring starts 10px out, as on the Ring stage. -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52%;
        height: 52%;
        translate: -50% -50%;
        animation: spin 3s linear infinite;
      }
      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        svg {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <canvas></canvas>
    <!-- The record from build/icon.svg, cut to the disc. The label's two arcs
         are off center, so the turning shows. -->
    <svg viewBox="78 78 356 356" aria-hidden="true">
      <circle cx="256" cy="256" r="178" fill="#111216" />
      <circle cx="256" cy="256" r="150" fill="none" stroke="#2a2d38" stroke-width="4" />
      <circle cx="256" cy="256" r="122" fill="none" stroke="#2a2d38" stroke-width="4" />
      <circle cx="256" cy="256" r="72" fill="#4cc3c9" />
      <path
        d="M 206 236 A 54 54 0 0 1 236 206 M 306 276 A 54 54 0 0 1 276 306"
        fill="none"
        stroke="#2e8a90"
        stroke-width="8"
        stroke-linecap="round"
      />
      <circle cx="256" cy="256" r="16" fill="#f3f4f7" />
    </svg>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
